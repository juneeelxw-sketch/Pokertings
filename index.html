<title>Pokertings Trainer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one working column like a card-room clipboard; the felt strip is the only dark, bold object. */
:root {
  --bg: #eef2ee;
  --surface: #ffffff;
  --ink: #16201b;
  --muted: #56655d;
  --line: #d3dcd6;
  --accent: #1d6a4c;
  --accent-ink: #ffffff;
  --felt: #1b4a37;
  --felt-edge: #123527;
  --on-felt: #eef5f0;
  --on-felt-dim: #a9c6b6;
  --good: #1c7a45;
  --good-bg: #e2f2e8;
  --ok: #9a6512;
  --ok-bg: #fbf0da;
  --bad: #b3261e;
  --bad-bg: #fbe5e3;
  --card-face: #ffffff;
  --card-edge: #c9cfcb;
  --suit-s: #1b1b1b;
  --suit-h: #c62828;
  --suit-d: #1565c0;
  --suit-c: #2e7d32;
  --chip: #d4a72c;
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1411; --surface: #161f1a; --ink: #e5ece7; --muted: #95a69c; --line: #2a3730;
    --accent: #4fb38a; --accent-ink: #07130d; --felt: #173f2f; --felt-edge: #0b2419; --on-felt: #eef5f0; --on-felt-dim: #9dbcac;
    --good: #5acb8a; --good-bg: #16301f; --ok: #e6ae4a; --ok-bg: #33270f; --bad: #f2776c; --bad-bg: #3a1714;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1411; --surface: #161f1a; --ink: #e5ece7; --muted: #95a69c; --line: #2a3730;
  --accent: #4fb38a; --accent-ink: #07130d; --felt: #173f2f; --felt-edge: #0b2419; --on-felt: #eef5f0; --on-felt-dim: #9dbcac;
  --good: #5acb8a; --good-bg: #16301f; --ok: #e6ae4a; --ok-bg: #33270f; --bad: #f2776c; --bad-bg: #3a1714;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; margin: 0; }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 48px; }
h1, h2, h3 { font-family: var(--f-display); letter-spacing: .01em; text-wrap: balance; margin: 0; line-height: 1.1; }
h2 { font-size: 30px; font-weight: 800; }
h3 { font-size: 21px; font-weight: 600; }
p { margin: 0; max-width: 68ch; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--chip); outline-offset: 2px; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding-block: 8px 14px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-size: 34px; font-weight: 800; text-transform: uppercase; }
.brand h1 span { color: var(--accent); }
.brand small { color: var(--muted); font-size: 13px; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; overflow-x: auto; max-width: 100%; }
.tabs button { border: 0; background: transparent; color: var(--muted); padding: 6px 14px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

/* Scoreline */
.scoreline { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); padding-block: 4px 12px; }
.scoreline b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; }

/* Controls */
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 12px; }
.field { display: grid; gap: 3px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
select { font: inherit; font-size: 14px; text-transform: none; letter-spacing: 0; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 7px 12px; border-radius: 8px; font-size: 14px; }
.seg button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); font-weight: 600; }

/* Felt */
.felt { background: radial-gradient(120% 90% at 50% 30%, var(--felt) 0%, var(--felt-edge) 100%); color: var(--on-felt); border-radius: 22px; padding: 18px; display: grid; gap: 14px; box-shadow: inset 0 0 0 6px rgba(0,0,0,.18); }
.villain { display: flex; gap: 12px; align-items: flex-start; }
.vbadge { flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 18px; background: var(--chip); color: #1c1606; border: 3px dashed rgba(255,255,255,.55); }
.villain .who { font-weight: 600; }
.villain .who em { font-style: normal; color: var(--on-felt-dim); font-weight: 400; }
.villain p { font-size: 13px; color: var(--on-felt-dim); }
.log { font-size: 13px; color: var(--on-felt-dim); display: flex; flex-wrap: wrap; gap: 2px 12px; }
.log span:last-child { color: var(--on-felt); font-weight: 600; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.board { display: flex; gap: 6px; min-height: 64px; align-items: center; }
.board .empty { color: var(--on-felt-dim); font-size: 13px; }
.pot { font-family: var(--f-mono); font-size: 14px; background: rgba(0,0,0,.25); border-radius: 999px; padding: 4px 12px; }
.hero { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; border-top: 1px dashed rgba(255,255,255,.2); padding-top: 12px; }
.hero .cards { display: flex; gap: 6px; }
.hero .meta { font-size: 13px; color: var(--on-felt-dim); }
.hero .meta b { color: var(--on-felt); font-weight: 600; }
.prompt { font-size: 16px; font-weight: 600; }

.card { width: 44px; height: 62px; border-radius: 7px; background: var(--card-face); border: 1px solid var(--card-edge); display: grid; place-items: center; align-content: center; line-height: 1; box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.card b { font-family: var(--f-display); font-size: 25px; font-weight: 800; }
.card i { font-style: normal; font-size: 18px; }
.card.big { width: 54px; height: 76px; }
.card.big b { font-size: 31px; }
.card.big i { font-size: 22px; }
.card.s { color: var(--suit-s); } .card.h { color: var(--suit-h); } .card.d { color: var(--suit-d); } .card.c { color: var(--suit-c); }
.card.sm { width: 34px; height: 46px; }
.card.sm b { font-size: 19px; } .card.sm i { font-size: 14px; }

/* Actions */
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-block: 14px; }
.actions button { flex: 1 1 120px; padding: 12px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 15px; }
.actions button:hover:not(:disabled) { border-color: var(--accent); }
.actions button.pick-best { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.actions button.pick-ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.actions button.pick-bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.actions button:disabled { cursor: default; }
.hintbtn { background: none; border: 0; color: var(--accent); padding: 0; font-weight: 600; font-size: 14px; }
.hint { font-size: 14px; color: var(--muted); }

/* Feedback */
.feedback { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 14px; }
.verdict { display: flex; align-items: flex-start; gap: 12px; }
.pill { flex: none; font-family: var(--f-display); font-weight: 800; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; border-radius: 999px; padding: 4px 12px; }
.pill.best { background: var(--good-bg); color: var(--good); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.mistake { background: var(--bad-bg); color: var(--bad); }
.verdict h3 { font-size: 22px; }
.verdict .loss { font-size: 14px; color: var(--bad); margin-top: 4px; }
.math { width: 100%; border-collapse: collapse; font-size: 14px; }
.math td { padding: 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.math td:first-child { color: var(--muted); padding-right: 14px; width: 42%; }
.math td:last-child { font-family: var(--f-mono); font-size: 13px; }
.evs { display: flex; flex-wrap: wrap; gap: 8px; }
.ev { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 13px; display: grid; min-width: 96px; }
.ev span { color: var(--muted); }
.ev b { font-family: var(--f-mono); font-weight: 500; }
.ev.top { border-color: var(--good); }
.ev.mine { box-shadow: inset 0 0 0 1px var(--ink); }
.rangebar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--line); }
.rangebar div { height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.c-strong { background: #b3261e; } .c-draw { background: #7b52ab; } .c-medium { background: #d4a72c; } .c-weak { background: #6e8f7c; } .c-air { background: #a9b3ad; }
.notes { display: grid; gap: 8px; padding-left: 18px; margin: 0; font-size: 14px; }
.next { justify-self: start; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 11px 22px; font-weight: 600; }
.label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.loading { color: var(--on-felt-dim); font-size: 14px; }

/* Quiz */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 14px; }
.qopts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.qopts button { padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-family: var(--f-mono); font-size: 16px; }
.qopts button.right { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.qopts button.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.qcards { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; background: var(--felt); padding: 12px; border-radius: 12px; color: var(--on-felt); font-size: 13px; }
.qcards > div { display: flex; gap: 4px; align-items: center; }

/* Lessons */
.lessons { display: grid; gap: 12px; }
details { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 18px; }
details[open] { padding-bottom: 16px; }
summary { cursor: pointer; padding-block: 12px; font-family: var(--f-display); font-size: 21px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; color: var(--accent); }
details[open] summary::after { content: "–"; }
.lesson { display: grid; gap: 10px; font-size: 15px; }
.lesson ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
.tbl th, .tbl td { text-align: left; padding: 6px 12px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.tbl td.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.callout { border-left: 3px solid var(--chip); padding: 4px 0 4px 12px; }

/* Progress */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; }
.tile b { font-family: var(--f-mono); font-size: 24px; font-weight: 500; }
.tile span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.tile small { font-size: 12px; color: var(--muted); }
.leaks { display: grid; gap: 8px; }
.leak { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.leak b { font-weight: 600; }
.leak .c { font-family: var(--f-mono); color: var(--bad); }
.leak p { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.tracker { display: grid; gap: 12px; }
.tbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tbtns button { padding: 20px 10px; border-radius: 14px; font-size: 17px; font-weight: 600; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.tbtns .play { border-color: var(--bad); color: var(--bad); }
.tbtns .fold { border-color: var(--good); color: var(--good); }
.gauge { position: relative; height: 18px; border-radius: 9px; background: var(--line); overflow: hidden; }
.gauge .band { position: absolute; top: 0; bottom: 0; background: var(--good-bg); border-left: 2px solid var(--good); border-right: 2px solid var(--good); }
.gauge .mark { position: absolute; top: -2px; bottom: -2px; width: 4px; background: var(--ink); border-radius: 2px; transform: translateX(-2px); }
.gscale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-family: var(--f-mono); }
.small { font-size: 13px; color: var(--muted); }
.linkbtn { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 0; font-size: 14px; }
.danger { color: var(--bad); }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }
.confirm button { border-radius: 8px; padding: 6px 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.confirm .yes { border-color: var(--bad); color: var(--bad); }
.hist { font-size: 13px; }
.hist td { padding: 4px 14px 4px 0; border-bottom: 1px solid var(--line); }

@media (max-width: 520px) {
  .brand h1 { font-size: 28px; }
  .tabs { width: 100%; }
  .tabs button { flex: 1 1 auto; padding: 6px 8px; font-size: 14px; }
  .card.big { width: 48px; height: 68px; }
  .felt { padding: 14px; border-radius: 18px; }
  .math td:first-child { width: 48%; }
}
@media (prefers-reduced-motion: no-preference) {
  .feedback { animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Poker<span>tings</span></h1><small>$1/$1 home-game trainer</small></div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="train" aria-selected="true" id="tab-train">Train</button>
      <button role="tab" data-tab="quiz" aria-selected="false" id="tab-quiz">Odds quiz</button>
      <button role="tab" data-tab="learn" aria-selected="false" id="tab-learn">Lessons</button>
      <button role="tab" data-tab="stats" aria-selected="false" id="tab-stats">Progress</button>
    </nav>
  </header>

  <!-- TRAIN -->
  <section id="view-train" role="tabpanel" aria-labelledby="tab-train">
    <div class="scoreline" id="scoreline"></div>
    <div class="controls">
      <div class="field">Drill
        <div class="seg" id="modeSeg">
          <button data-mode="mixed" aria-pressed="true">Mixed</button>
          <button data-mode="preflop" aria-pressed="false">Preflop</button>
          <button data-mode="decision" aria-pressed="false">Call or fold</button>
          <button data-mode="sizing" aria-pressed="false">Bet sizing</button>
        </div>
      </div>
      <label class="field" for="villainSel">Opponent
        <select id="villainSel">
          <option value="random">Random mix</option>
          <option value="nit">Nick · Nit</option>
          <option value="tag">Tina · TAG</option>
          <option value="lag">Larry · LAG</option>
          <option value="station">Steve · Calling station</option>
          <option value="maniac">Max · Maniac</option>
        </select>
      </label>
      <label class="field" for="straddleSel">Straddle
        <select id="straddleSel">
          <option value="random">Mix (like my game)</option>
          <option value="none">No straddle</option>
          <option value="utg">UTG straddle $2</option>
          <option value="btn">Mississippi $2</option>
        </select>
      </label>
      <label class="field" for="stackSel">Stacks
        <select id="stackSel">
          <option value="100">$100</option>
          <option value="200" selected>$200</option>
          <option value="300">$300</option>
          <option value="500">$500</option>
          <option value="1000">$1,000</option>
        </select>
      </label>
    </div>

    <div class="felt" id="felt"><p class="loading">Dealing…</p></div>
    <div class="actions" id="actions"></div>
    <div id="hintWrap"></div>
    <div class="feedback" id="feedback" hidden></div>
  </section>

  <!-- QUIZ -->
  <section id="view-quiz" role="tabpanel" aria-labelledby="tab-quiz" hidden>
    <div class="scoreline" id="quizline"></div>
    <div class="panel" id="quiz"></div>
  </section>

  <!-- LESSONS -->
  <section id="view-learn" role="tabpanel" aria-labelledby="tab-learn" hidden>
    <div class="lessons" id="lessons"></div>
  </section>

  <!-- PROGRESS -->
  <section id="view-stats" role="tabpanel" aria-labelledby="tab-stats" hidden>
    <div id="stats"></div>
  </section>
</div>

<script src="engine.js"></script>
<script src="coach.js"></script>
<script src="app.js"></script>
